<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بطاقة محتوى احترافية</title>
  <!-- مكتبة FontAwesome للأيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #2563eb;
      --text-color: #1e293b;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --transition-speed: 0.3s;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    /* حاوي البطاقات */
    .card-container {
      display: flex;
      gap: 25px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1200px;
    }

    /* تصميم البطاقة الرئيسي */
    .article-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
      cursor: pointer;
      position: relative;
      text-decoration: none;
      color: inherit;
    }

    .article-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.12);
    }

    /* قسم الصورة والغلاف التفاعلي */
    .image-wrapper {
      position: relative;
      width: 100%;
      height: 200px;
      overflow: hidden;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform var(--transition-speed) ease;
    }

    .article-card:hover .image-wrapper img {
      transform: scale(1.08);
    }

    /* طبقة أيقونة القراءة والطباقة التفاعلية */
    .read-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(37, 99, 235, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      opacity: 0;
      transition: opacity var(--transition-speed) ease;
      backdrop-filter: blur(2px);
    }

    .read-overlay i {
      font-size: 2.5rem;
      transform: scale(0.5);
      transition: transform var(--transition-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .read-overlay span {
      margin-top: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* تأثير الظهور عند التمرير والضغط */
    .article-card:hover .read-overlay,
    .article-card:active .read-overlay {
      opacity: 1;
    }

    .article-card:hover .read-overlay i,
    .article-card:active .read-overlay i {
      transform: scale(1);
    }

    /* محتوى البطاقة */
    .card-content {
      padding: 20px;
    }

    .tag {
      display: inline-block;
      background-color: #e0e7ff;
      color: var(--primary-color);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 7rem;
      margin: 0 0 10px 0;
      color: var(--text-color);
      line-height: 1.4;
    }

    .card-description {
      font-size: 0.9rem;
      color: #64748b;
      line-height: 1.6;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- بطاقة 1 -->
    <a href="#" class="article-card">
      <div class="image-wrapper">
        <img src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=800&q=80" alt="صورة المقال">
        <div class="read-overlay">
          <i class="fa-solid fa-book-open-reader"></i>
          <span>اضغط للقراءة</span>
        </div>
      </div>
      <div class="card-content">
        <span class="tag">تقنية</span>
        <h3 class="card-title">دليل تصميم واجهات المستخدم الحديثة 2026</h3>
        <p class="card-description">استكشف أحدث الاتجاهات والتقنيات لبناء تجربة مستخدم سلسة وجذابة...</p>
      </div>
    </a>

    <!-- بطاقة 2 -->
    <a href="#" class="article-card">
      <div class="image-wrapper">
        <img src="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=800&q=80" alt="صورة المقال">
        <div class="read-overlay">
          <i class="fa-solid fa-pen-nib"></i>
          <span>دخول للمقال</span>
        </div>
      </div>
      <div class="card-content">
        <span class="tag">تطوير</span>
        <h3 class="card-title">كيف تكتب كوداً أنظيفاً واحترافياً؟</h3>
        <p class="card-description">نصائح وإرشادات علمية لمساعدتك على تحسين جودة برمجتك وسهولة صيانتها...</p>
      </div>
    </a>

  </div>

</body>
</html>
