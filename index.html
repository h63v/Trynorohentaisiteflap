<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة المانجا والمانهوا</title>
  <!-- مكتبة الأيقونات FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #2563eb;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 30px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-title {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2rem;
    }

    /* شبكة البطاقات */
    .manga-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
    }

    /* تصميم البطاقة */
    .manga-card {
      background-color: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      cursor: pointer;
    }

    .manga-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 30px rgba(37, 99, 235, 0.2);
    }

    /* غلاف الصورة والتراكب */
    .poster-wrapper {
      position: relative;
      width: 100%;
      height: 350px;
      overflow: hidden;
    }

    .poster-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .manga-card:hover .poster-wrapper img {
      transform: scale(1.06);
    }

    /* الطبقة التفاعلية عند التمرير/الضغط */
    .read-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(3px);
    }

    .read-overlay i {
      font-size: 3rem;
      color: var(--primary);
      transform: scale(0.6);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .read-overlay span {
      margin-top: 12px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .manga-card:hover .read-overlay,
    .manga-card:active .read-overlay {
      opacity: 1;
    }

    .manga-card:hover .read-overlay i,
    .manga-card:active .read-overlay i {
      transform: scale(1);
    }

    /* تفاصيل البطاقة */
    .info {
      padding: 18px;
    }

    .badge-container {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge.type { background: #3b82f6; color: #fff; }
    .badge.status-ongoing { background: #22c55e; color: #fff; }
    .badge.status-completed { background: #ef4444; color: #fff; }

    .title {
      font-size: 1.2rem;
      margin: 0 0 8px 0;
    }

    .synopsis {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="header-title">مكتبة الأعمال</h1>
    <div class="manga-grid" id="mangaContainer">
      <!-- يتم تحميل البطاقات برمجياً هنا -->
    </div>
  </div>

  <script>
    // قائمة المجلدات الموجودة داخل مجلد mangamanhwa
    const worksFolders = ['One Piece', 'Solo Leveling']; 

    const container = document.getElementById('mangaContainer');

    async function loadWorks() {
      for (const folder of worksFolders) {
        try {
          // جلب ملف HTML الخاص بالعمل داخل مجلده
          const response = await fetch(`./mangamanhwa/${folder}/${folder}.html`);
          const htmlText = await response.text();

          // تحويل النص إلى عنصر DOM لسهولة استخراج البيانات
          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');

          // استخراج البيانات من داخل الملف
          const title = doc.querySelector('.work-title')?.textContent || folder;
          const image = doc.querySelector('.work-image')?.getAttribute('src') || `./mangamanhwa/${folder}/cover.jpg`;
          const type = doc.querySelector('.work-type')?.textContent || 'مانجا';
          const status = doc.querySelector('.work-status')?.textContent || 'مستمر';
          const synopsis = doc.querySelector('.work-synopsis')?.textContent || 'لا يوجد وصف...';
          const statusClass = status.includes('مكتمل') ? 'status-completed' : 'status-ongoing';

          // رابط الانتقال لصفحة العمل أو الفصل الأول
          const workUrl = `./mangamanhwa/${folder}/${folder}.html`;

          // إنشاء البطاقة Dynamically
          const cardHTML = `
            <a href="${workUrl}" class="manga-card">
              <div class="poster-wrapper">
                <img src="${image}" alt="${title}">
                <div class="read-overlay">
                  <i class="fa-solid fa-book-open"></i>
                  <span>دخول للقراءة</span>
                </div>
              </div>
              <div class="info">
                <div class="badge-container">
                  <span class="badge type">${type}</span>
                  <span class="badge ${statusClass}">${status}</span>
                </div>
                <h3 class="title">${title}</h3>
                <p class="synopsis">${synopsis}</p>
              </div>
            </a>
          `;

          container.innerHTML += cardHTML;
        } catch (error) {
          console.error(`خطأ في تحميل العمل: ${folder}`, error);
        }
      }
    }

    // تشغيل الدالة عند تحميل الصفحة
    loadWorks();
  </script>
</body>
</html>
